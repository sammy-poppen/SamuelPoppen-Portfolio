<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlexForm UAV Design</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="CAD renders of the current FlexForm Aeronautics UAV design.">
<script>try{var t=localStorage.getItem('sp-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Martian+Mono:wdth,wght@75..112.5,300..700&display=swap">
<style>
/* Layout: same drawing-set language as the portfolio. A title block, then the renders as
   framed figures on the 0.25 in grid: one large lead view and a two-column set below.
   Black and white, with the CAD environment's slate kept as the matte behind each render. */
:root{
  --paper:#FFFFFF; --paper-2:#F2F2F2; --ink:#000000; --ink-2:#575757;
  --rule:#DEDEDE; --rule-strong:#9E9E9E;
  --grid:rgba(0,0,0,.055); --grid-major:rgba(0,0,0,.1);
  --cad:#2E3440;          /* matte = the renders' own background, so letterboxing disappears */
  --scrim:rgba(0,0,0,.8);
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"Martian Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --gut:max(20px, env(safe-area-inset-left, 0px));
  --gut-r:max(20px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#000000; --paper-2:#141414; --ink:#FFFFFF; --ink-2:#A8A8A8;
    --rule:#2B2B2B; --rule-strong:#5C5C5C;
    --grid:rgba(255,255,255,.06); --grid-major:rgba(255,255,255,.11);
    --scrim:rgba(0,0,0,.85);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#000000; --paper-2:#141414; --ink:#FFFFFF; --ink-2:#A8A8A8;
  --rule:#2B2B2B; --rule-strong:#5C5C5C;
  --grid:rgba(255,255,255,.06); --grid-major:rgba(255,255,255,.11);
  --scrim:rgba(0,0,0,.85);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html:has(dialog[open]){overflow:hidden}
body{
  margin:0;background-color:var(--paper);color:var(--ink);
  background-image:
    linear-gradient(var(--grid-major) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:96px 96px,96px 96px,24px 24px,24px 24px;
  font:400 16px/1.6 var(--body);-webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gut-r)}

/* top bar (matches the portfolio) */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:14px;height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:14px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.mark{width:30px;height:30px;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:11px;letter-spacing:0}
.back{margin-left:auto;font:500 11px/1 var(--mono);font-stretch:87.5%;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:var(--ink-2);padding:9px 9px;white-space:nowrap}
.back:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.resume-btn{flex:none;font:600 11px/1 var(--mono);font-stretch:87.5%;letter-spacing:.06em;text-transform:uppercase;padding:11px 12px;border:1.5px solid var(--ink);color:var(--ink);text-decoration:none;white-space:nowrap}
.resume-btn:hover{background:var(--ink);color:var(--paper)}
.icon-btn{flex:none;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--rule-strong);background:var(--paper);color:var(--ink);cursor:pointer;padding:0}
.icon-btn:hover{border-color:var(--ink)}
.icon-btn svg{width:16px;height:16px}

/* title block */
.head{padding-block:clamp(48px,7vw,88px) 36px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px 40px;align-items:end}
.head-copy{display:grid;gap:16px;min-width:0}
.eyebrow{display:flex;align-items:center;gap:10px;margin:0;font:500 11px/1.3 var(--mono);font-stretch:87.5%;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.eyebrow::before{content:"";width:22px;height:1px;background:currentColor;flex:none}
h1{margin:0;font-family:var(--display);font-stretch:112.5%;font-weight:780;font-size:clamp(38px,6vw,76px);line-height:1;letter-spacing:-.015em;text-wrap:balance}
.lede{margin:0;font-size:18px;color:var(--ink-2);max-width:60ch}
.tb{display:grid;grid-template-columns:repeat(2,auto);border:1.5px solid var(--ink);background:var(--paper)}
.tb div{padding:8px 14px;border-left:1px solid var(--rule-strong);border-top:1px solid var(--rule-strong);display:grid;gap:3px}
.tb div:nth-child(odd){border-left:0}
.tb div:nth-child(-n+2){border-top:0}
.tb small{font:500 9px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.tb span{font:600 12px/1.2 var(--mono);font-stretch:87.5%;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}

/* gallery */
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 28px;padding-bottom:clamp(64px,8vw,112px)}
.fig{margin:0;display:grid;gap:10px;min-width:0}
.fig.lead{grid-column:1 / -1}
.shot{position:relative;display:block;width:100%;padding:0;border:1.5px solid var(--ink);background:var(--cad);cursor:zoom-in;aspect-ratio:4/3;overflow:hidden}
.fig.lead .shot{aspect-ratio:16/9}
.shot img{width:100%;height:100%;object-fit:contain;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.shot:hover img{transform:scale(1.03)}
.shot::after{content:"Enlarge ↗";position:absolute;right:10px;bottom:10px;padding:6px 8px;background:var(--paper);color:var(--ink);border:1px solid var(--ink);font:500 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;opacity:0;transition:opacity .2s}
.shot:hover::after,.shot:focus-visible::after{opacity:1}
.fig figcaption{display:flex;gap:12px;align-items:baseline;font:500 11px/1.4 var(--mono);font-stretch:87.5%;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.fig figcaption b{color:var(--ink);font-weight:600}

footer{border-top:1.5px solid var(--ink);background:var(--paper)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-block:22px;font:500 11px/1.4 var(--mono);font-stretch:87.5%;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
footer a{text-decoration:none}
footer a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* full-size viewer */
dialog.lb{padding:0;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);width:min(1400px,calc(100vw - 32px));max-width:none;height:calc(100dvh - 32px);max-height:none;overflow:hidden}
dialog.lb[open]{display:flex;flex-direction:column}
dialog.lb::backdrop{background:var(--scrim)}
.lbar{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 20px;border-bottom:1.5px solid var(--ink);font:500 11px/1.3 var(--mono);font-stretch:87.5%;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.lbar b{color:var(--ink);font-weight:600}
.lbar .acts{margin-left:auto;display:flex;gap:6px}
.lstage{flex:1;min-height:0;background:var(--cad);display:grid;place-items:center;padding:12px}
.lstage img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}

@media (max-width:860px){
  .head{grid-template-columns:minmax(0,1fr)}
  .tb{justify-self:start}
}
@media (max-width:640px){
  .brand .bname{display:none}
  .top .wrap{gap:8px}
  .gallery{grid-template-columns:minmax(0,1fr);gap:28px}
  .shot,.fig.lead .shot{aspect-ratio:4/3}
  .shot::after{opacity:1}
  dialog.lb{width:100vw;height:100dvh;border:0;margin:0}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="portfolioindex.html" aria-label="Samuel Poppen, portfolio home"><span class="mark">SP</span><span class="bname">Samuel Poppen</span></a>
    <a class="back" href="portfolioindex.html#flexform">← Back to FlexForm</a>
    <a class="resume-btn" href="Samuel-Poppen-Resume.pdf" target="_blank" rel="noopener">Resume</a>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch to dark theme">
      <svg id="icoMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg id="icoSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" hidden><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <section class="head">
    <div class="head-copy">
      <p class="eyebrow">FlexForm Aeronautics Inc. · UAV</p>
      <h1>UAV design iterations</h1>
      <p class="lede">CAD renders of our current UAV design. Select any view to see it full size.</p>
    </div>
    <div class="tb" aria-label="Drawing details">
      <div><small>Program</small><span>FlexForm UAV</span></div>
      <div><small>Status</small><span>In design</span></div>
      <div><small>Views</small><span>5</span></div>
      <div><small>Rev</small><span>2026</span></div>
    </div>
  </section>

  <section class="gallery" id="gallery" aria-label="UAV renders">
    <figure class="fig lead">
      <button class="shot" type="button" data-i="0"><img src="images/uav/uav-three-quarter.jpg" alt="CAD render of the FlexForm UAV, three-quarter view" width="1402" height="1035"></button>
      <figcaption><b>Fig. 1</b>Three-quarter view</figcaption>
    </figure>
    <figure class="fig">
      <button class="shot" type="button" data-i="1"><img src="images/uav/uav-top.jpg" alt="CAD render of the FlexForm UAV, top view" width="730" height="1117" loading="lazy"></button>
      <figcaption><b>Fig. 2</b>Top view</figcaption>
    </figure>
    <figure class="fig">
      <button class="shot" type="button" data-i="2"><img src="images/uav/uav-front.jpg" alt="CAD render of the FlexForm UAV, front view" width="1617" height="395" loading="lazy"></button>
      <figcaption><b>Fig. 3</b>Front view</figcaption>
    </figure>
    <figure class="fig">
      <button class="shot" type="button" data-i="3"><img src="images/uav/uav-fuselage.jpg" alt="CAD render of the FlexForm UAV fuselage and rear duct with the wings removed" width="1587" height="865" loading="lazy"></button>
      <figcaption><b>Fig. 4</b>Fuselage, wings removed</figcaption>
    </figure>
    <figure class="fig">
      <button class="shot" type="button" data-i="4"><img src="images/uav/uav-exploded.jpg" alt="CAD render of the FlexForm UAV as an exploded assembly" width="2000" height="1012" loading="lazy"></button>
      <figcaption><b>Fig. 5</b>Exploded assembly</figcaption>
    </figure>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 Samuel Poppen · FlexForm Aeronautics Inc.</span>
    <a href="portfolioindex.html#flexform">← Back to portfolio</a>
  </div>
</footer>

<dialog class="lb" id="lb" aria-label="Full-size render">
  <div class="lbar">
    <span id="lbCap"></span>
    <div class="acts">
      <button class="icon-btn" id="lbPrev" type="button" aria-label="Previous view"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg></button>
      <button class="icon-btn" id="lbNext" type="button" aria-label="Next view"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg></button>
      <button class="icon-btn" id="lbClose" type="button" aria-label="Close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button>
    </div>
  </div>
  <div class="lstage"><img id="lbImg" src="" alt=""></div>
</dialog>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};

  /* full-size viewer */
  var shots=[].slice.call(document.querySelectorAll(".shot")), lb=$("lb"), cur=0;
  function show(i){
    cur=(i+shots.length)%shots.length;
    var s=shots[cur], img=s.querySelector("img"), cap=s.parentNode.querySelector("figcaption");
    $("lbImg").src=img.src; $("lbImg").alt=img.alt;
    $("lbCap").innerHTML="<b>"+cap.querySelector("b").textContent+"</b> · "+cap.lastChild.textContent+" · "+(cur+1)+" of "+shots.length;
    if(!lb.open) lb.showModal();
  }
  shots.forEach(function(s,i){ s.addEventListener("click",function(){ show(i); }); });
  $("lbPrev").onclick=function(){show(cur-1);};
  $("lbNext").onclick=function(){show(cur+1);};
  $("lbClose").onclick=function(){lb.close();};
  lb.addEventListener("click",function(e){ if(e.target===lb || e.target.classList.contains("lstage")) lb.close(); });
  lb.addEventListener("keydown",function(e){ if(e.key==="ArrowRight") show(cur+1); else if(e.key==="ArrowLeft") show(cur-1); });
  lb.addEventListener("close",function(){ shots[cur].focus({preventScroll:true}); });

  /* theme toggle (shares the portfolio's saved choice) */
  var root=document.documentElement, mq=matchMedia("(prefers-color-scheme: dark)");
  function eff(){return root.dataset.theme || (mq.matches ? "dark" : "light");}
  function syncBtn(){
    var d=eff()==="dark";
    $("icoMoon").toggleAttribute("hidden", d); $("icoSun").toggleAttribute("hidden", !d);
    $("themeBtn").setAttribute("aria-label", d ? "Switch to light theme" : "Switch to dark theme");
    $("themeBtn").title = d ? "Light theme" : "Dark theme";
  }
  $("themeBtn").addEventListener("click",function(){
    var next=eff()==="dark" ? "light" : "dark";
    root.dataset.theme=next;
    try{localStorage.setItem("sp-theme", next);}catch(e){}
    syncBtn();
  });
  if(mq.addEventListener) mq.addEventListener("change",syncBtn);
  syncBtn();
})();
</script>
</body>
</html>
