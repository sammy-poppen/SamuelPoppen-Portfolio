<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triangulation Interpolation Walkthrough</title>
<style>
/* Standalone version: all colors are tokens so it works on light or dark pages */
:root{
  --text-primary:#1f1e1d; --text-secondary:#5f5e5a; --text-muted:#888780;
  --border-strong:rgba(31,30,29,.22); --surface-1:#f5f4ef; --surface-2:#ffffff; --page:#ffffff;
  --tri-fill:#FAC775; --tri-stroke:#BA7517; --guide:#993C1D; --spot:#D85A30;
  --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-mono:ui-monospace,Menlo,Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){:root{
  --text-primary:#ecebe6; --text-secondary:#b4b2a9; --text-muted:#888780;
  --border-strong:rgba(236,235,230,.25); --surface-1:#2a2a28; --surface-2:#1f1f1d; --page:#1f1f1d;
  --tri-fill:#EF9F27; color-scheme:dark}}
body{margin:0;background:var(--page);color:var(--text-primary);font-family:var(--font-sans)}
.hm-wrap{max-width:720px;margin:0 auto;padding:16px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.hm-hint{font-size:13px;color:var(--text-secondary);margin:4px 0 6px}
#map{display:block;width:100%;height:auto;cursor:crosshair}
#map .ts{font-family:var(--font-sans);font-size:12px;fill:var(--text-secondary)}
#map .th{font-family:var(--font-sans);font-size:14px;font-weight:500;fill:var(--text-primary)}
.calc{font-family:var(--font-mono);font-size:13px;line-height:1.75;color:var(--text-primary);overflow-wrap:anywhere}
.calc .lbl{font-family:var(--font-sans);color:var(--text-secondary);font-size:13px;margin-top:10px}
.res{font-family:var(--font-sans);font-size:15px;font-weight:500;margin-top:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:6px 0}
.cv{background:var(--surface-1);border-radius:8px;padding:8px 10px;font-family:var(--font-mono);font-size:12.5px;line-height:1.6}
.cv b{font-family:var(--font-sans);font-weight:500}
</style>
</head>
<body>
<div class="hm-wrap">
<h2 class="sr-only">Map of the 12.25 by 9.75 inch sheet with the 87 test points joined into triangles; clicking a spot highlights the triangle that contains it and shows the barycentric interpolation calculation step by step.</h2>
<div class="hm-hint">Click anywhere on the sheet to move the spot. Hardness values are the example readings.</div>
<svg id="map" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg"><title>Triangulated sheet</title><desc>Delaunay triangles between test points with the containing triangle highlighted</desc>
<g id="axes"></g><g id="mesh"></g><g id="hl"></g><g id="pts"></g><g id="spot"></g></svg>
<div class="calc" id="calc"></div>
</div>
<script>
/* P: [x (in), y (in), hardness HRB] measured from sheet center. Replace the third value with real readings. */
const P=[[-0.75,-4.5,95.3],[0.0,-4.5,98.4],[0.75,-4.5,94.8],[-0.75,-3.5,99.3],[0.0,-3.5,100.3],[0.75,-3.5,96.9],[-0.75,-2.5,95.0],[0.0,-2.5,97.5],[0.75,-2.5,98.9],[-0.75,-1.5,98.1],[0.0,-1.5,98.0],[0.75,-1.5,98.4],[-0.75,-0.75,98.4],[0.0,-0.75,99.5],[0.75,-0.75,96.7],[-0.75,0.0,98.8],[0.0,0.0,101.1],[0.75,0.0,99.2],[-0.75,0.75,99.0],[0.0,0.75,100.9],[0.75,0.75,96.9],[-0.75,1.5,97.4],[0.0,1.5,97.3],[0.75,1.5,98.0],[-0.75,2.5,94.9],[0.0,2.5,97.9],[0.75,2.5,96.7],[-0.75,3.5,99.1],[0.0,3.5,98.5],[0.75,3.5,97.4],[-0.75,4.5,96.5],[0.0,4.5,98.1],[0.75,4.5,98.5],[-5.75,-0.75,94.6],[-5.75,0.0,100.3],[-5.75,0.75,95.5],[-4.75,-0.75,95.4],[-4.75,0.0,96.7],[-4.75,0.75,99.3],[-3.75,-0.75,98.5],[-3.75,0.0,96.6],[-3.75,0.75,99.5],[-2.75,-0.75,97.0],[-2.75,0.0,99.6],[-2.75,0.75,95.7],[-1.75,-0.75,96.3],[-1.75,0.0,98.4],[-1.75,0.75,95.7],[1.75,-0.75,94.5],[1.75,0.0,100.4],[1.75,0.75,95.6],[2.75,-0.75,99.2],[2.75,0.0,97.5],[2.75,0.75,94.5],[3.75,-0.75,97.5],[3.75,0.0,96.7],[3.75,0.75,96.2],[4.75,-0.75,95.2],[4.75,0.0,100.3],[4.75,0.75,99.3],[5.75,-0.75,95.6],[5.75,0.0,96.7],[5.75,0.75,96.1],[-1.6,-1.6,52.1],[-3.2,-1.8,37.9],[-1.8,-3.3,36.8],[-4.4,-3.6,50.4],[-5.6,-1.9,30.6],[-2.9,-4.4,41.8],[-1.6,1.6,50.1],[-3.2,1.8,48.6],[-1.8,3.3,50.9],[-4.4,3.6,28.6],[-5.6,1.9,52.6],[-2.9,4.4,51.9],[1.6,-1.6,55.1],[3.2,-1.8,48.3],[1.8,-3.3,45.3],[4.4,-3.6,45.2],[5.6,-1.9,53.9],[2.9,-4.4,28.1],[1.6,1.6,62.6],[3.2,1.8,32.8],[1.8,3.3,35.0],[4.4,3.6,44.7],[5.6,1.9,33.7],[2.9,4.4,41.9]];
/* T: Delaunay triangles as 0-based indexes into P */
const T=[[67,36,33],[78,79,76],[85,84,82],[73,35,38],[84,86,82],[70,74,72],[73,70,72],[70,73,38],[41,70,38],[79,57,76],[57,79,60],[59,85,82],[51,75,76],[75,11,8],[71,70,69],[70,71,74],[24,71,69],[71,24,27],[74,71,30],[71,27,30],[70,44,69],[44,70,41],[64,67,66],[64,36,67],[68,64,66],[75,77,76],[77,75,8],[5,77,8],[77,5,2],[59,62,85],[51,48,75],[54,51,76],[57,54,76],[53,56,82],[56,59,82],[21,24,69],[18,21,69],[44,47,69],[47,18,69],[64,39,36],[65,64,68],[65,0,3],[0,65,68],[65,3,6],[80,78,76],[77,80,76],[80,77,2],[14,11,75],[48,14,75],[86,83,82],[32,83,86],[29,83,32],[50,81,20],[83,81,82],[81,50,53],[81,53,82],[42,39,64],[81,23,20],[26,83,29],[26,81,83],[26,23,81],[63,42,64],[9,63,6],[63,9,12],[63,65,6],[65,63,64],[63,45,42],[45,63,12],[57,61,58],[61,57,60],[37,40,41],[37,41,38],[35,37,38],[34,37,35],[36,37,33],[37,34,33],[61,62,58],[62,59,58],[4,7,6],[3,4,6],[4,5,8],[7,4,8],[4,0,1],[0,4,3],[2,4,1],[5,4,2],[54,57,58],[55,54,58],[10,7,8],[11,10,8],[59,56,58],[56,55,58],[52,54,55],[54,52,51],[56,52,55],[52,56,53],[48,52,49],[52,48,51],[24,28,27],[28,24,25],[24,21,25],[21,22,25],[50,52,53],[52,50,49],[50,17,49],[17,50,20],[21,19,22],[19,21,18],[19,17,20],[17,19,16],[37,39,40],[39,37,36],[14,48,49],[17,14,49],[14,10,11],[10,14,13],[14,17,16],[13,14,16],[28,31,27],[27,31,30],[31,29,32],[31,28,29],[15,19,18],[19,15,16],[15,13,16],[15,12,13],[7,9,6],[10,9,7],[9,10,13],[12,9,13],[23,19,20],[19,23,22],[26,28,25],[28,26,29],[22,26,25],[23,26,22],[40,43,41],[43,44,41],[39,43,40],[42,43,39],[46,15,18],[47,46,18],[43,46,44],[46,47,44],[45,43,42],[45,46,43],[15,45,12],[46,45,15]];
const NS="http://www.w3.org/2000/svg",S=48,OX=50,OY=20,HX=6.125,HY=4.875;
const sx=x=>OX+(x+HX)*S, sy=y=>OY+(HY-y)*S;
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
const ax=document.getElementById('axes');
el('rect',{x:sx(-HX),y:sy(HY),width:12.25*S,height:9.75*S,fill:'none',stroke:'var(--text-secondary)','stroke-width':1},ax);
for(let u=-6;u<=6;u++){el('line',{x1:sx(u),x2:sx(u),y1:sy(-HY),y2:sy(-HY)+4,stroke:'var(--text-muted)'},ax);const t=el('text',{x:sx(u),y:sy(-HY)+18,'text-anchor':'middle',class:'ts'},ax);t.textContent=u}
for(let u=-4;u<=4;u++){el('line',{x1:sx(-HX)-4,x2:sx(-HX),y1:sy(u),y2:sy(u),stroke:'var(--text-muted)'},ax);const t=el('text',{x:sx(-HX)-8,y:sy(u)+4,'text-anchor':'end',class:'ts'},ax);t.textContent=u}
const mesh=document.getElementById('mesh');
T.forEach(t=>el('polygon',{points:t.map(i=>sx(P[i][0])+','+sy(P[i][1])).join(' '),fill:'none',stroke:'var(--border-strong)','stroke-width':0.75},mesh));
const pg=document.getElementById('pts');
P.forEach(p=>el('circle',{cx:sx(p[0]),cy:sy(p[1]),r:2.6,fill:'var(--text-secondary)'},pg));
const f=(v,d=3)=>(Math.abs(v)<5e-4?0:v).toFixed(d);
const n=v=>v<0?`(${f(v)})`:f(v);
function bary(x,y,t){const[a,b,c]=t.map(i=>P[i]);const det=(b[1]-c[1])*(a[0]-c[0])+(c[0]-b[0])*(a[1]-c[1]);
 const la=((b[1]-c[1])*(x-c[0])+(c[0]-b[0])*(y-c[1]))/det,lb=((c[1]-a[1])*(x-c[0])+(a[0]-c[0])*(y-c[1]))/det;return{a,b,c,det,la,lb,lc:1-la-lb}}
function show(x,y){
 const hl=document.getElementById('hl'),sp=document.getElementById('spot'),calc=document.getElementById('calc');hl.innerHTML='';sp.innerHTML='';
 let hit=null,ti=-1;for(let i=0;i<T.length;i++){const r=bary(x,y,T[i]);if(r.la>=-1e-9&&r.lb>=-1e-9&&r.lc>=-1e-9){hit=r;ti=i;break}}
 if(hit){const t=T[ti],names=['A','B','C'];
  el('polygon',{points:t.map(i=>sx(P[i][0])+','+sy(P[i][1])).join(' '),fill:'var(--tri-fill)','fill-opacity':0.55,stroke:'var(--tri-stroke)','stroke-width':1.5},hl);
  t.forEach(i=>{el('line',{x1:sx(x),y1:sy(y),x2:sx(P[i][0]),y2:sy(P[i][1]),stroke:'var(--guide)','stroke-width':1,'stroke-dasharray':'3 3'},hl)});
  const cxm=t.reduce((s,i)=>s+sx(P[i][0]),0)/3,cym=t.reduce((s,i)=>s+sy(P[i][1]),0)/3;
  t.forEach((i,k)=>{const px=sx(P[i][0]),py=sy(P[i][1]);let dx=px-cxm,dy=py-cym;const m=Math.hypot(dx,dy)||1;dx/=m;dy/=m;
   el('circle',{cx:px,cy:py,r:4.5,fill:'var(--tri-stroke)'},hl);
   const tx=el('text',{x:px+dx*16,y:py+dy*16+4,'text-anchor':'middle',class:'th'},hl);tx.textContent=names[k]});
  el('circle',{cx:sx(x),cy:sy(y),r:5,fill:'var(--spot)',stroke:'var(--surface-2)','stroke-width':1.5},sp);
  const{a,b,c,det,la,lb,lc}=hit,H=la*a[2]+lb*b[2]+lc*c[2];
  calc.innerHTML=`<div class="lbl">Spot P = (${f(x)}, ${f(y)}) in. It lies inside triangle ${ti+1} (highlighted). Its three corners:</div>
  <div class="grid3">${t.map((i,k)=>`<div class="cv"><b>${names[k]}</b> · point ${i+1}<br>x = ${f(P[i][0],2)}, y = ${f(P[i][1],2)}<br>H = ${P[i][2].toFixed(1)} HRB</div>`).join('')}</div>
  <div class="lbl">Step 1: triangle determinant (twice the triangle's signed area)</div>
  det = (y_B − y_C)(x_A − x_C) + (x_C − x_B)(y_A − y_C)<br>
  &nbsp;&nbsp;&nbsp;&nbsp;= (${n(b[1])} − ${n(c[1])})(${n(a[0])} − ${n(c[0])}) + (${n(c[0])} − ${n(b[0])})(${n(a[1])} − ${n(c[1])}) = <b>${f(det,4)}</b>
  <div class="lbl">Step 2: barycentric weights (how much each corner counts)</div>
  λ_A = [(y_B − y_C)(x − x_C) + (x_C − x_B)(y − y_C)] / det<br>
  &nbsp;&nbsp;&nbsp;&nbsp;= [(${f(b[1]-c[1])})(${f(x-c[0])}) + (${f(c[0]-b[0])})(${f(y-c[1])})] / ${f(det,4)} = <b>${f(la,4)}</b><br>
  λ_B = [(y_C − y_A)(x − x_C) + (x_A − x_C)(y − y_C)] / det<br>
  &nbsp;&nbsp;&nbsp;&nbsp;= [(${f(c[1]-a[1])})(${f(x-c[0])}) + (${f(a[0]-c[0])})(${f(y-c[1])})] / ${f(det,4)} = <b>${f(lb,4)}</b><br>
  λ_C = 1 − λ_A − λ_B = 1 − ${f(la,4)} − ${f(lb,4)} = <b>${f(lc,4)}</b>
  <div class="lbl">All three are ≥ 0, which is how the spot is confirmed inside this triangle. Each λ equals the area of the small triangle opposite that corner divided by the whole triangle's area, so the closer P is to a corner, the bigger that corner's weight.</div>
  <div class="lbl">Step 3: weighted blend of the three readings</div>
  H = λ_A·H_A + λ_B·H_B + λ_C·H_C<br>
  &nbsp;&nbsp;= ${f(la,4)}(${a[2].toFixed(1)}) + ${f(lb,4)}(${b[2].toFixed(1)}) + ${f(lc,4)}(${c[2].toFixed(1)})<br>
  &nbsp;&nbsp;= ${f(la*a[2],2)} + ${f(lb*b[2],2)} + ${f(lc*c[2],2)}
  <div class="res">Predicted hardness at P ≈ ${H.toFixed(1)} HRB</div>`;
 }else{
  const d=P.map((p,i)=>({i,d2:(p[0]-x)**2+(p[1]-y)**2})).sort((u,v)=>u.d2-v.d2).slice(0,3);
  d.forEach(o=>{el('line',{x1:sx(x),y1:sy(y),x2:sx(P[o.i][0]),y2:sy(P[o.i][1]),stroke:'var(--guide)','stroke-width':1,'stroke-dasharray':'3 3'},hl);el('circle',{cx:sx(P[o.i][0]),cy:sy(P[o.i][1]),r:4.5,fill:'var(--tri-stroke)'},hl)});
  el('circle',{cx:sx(x),cy:sy(y),r:5,fill:'var(--spot)',stroke:'var(--surface-2)','stroke-width':1.5},sp);
  const w=d.map(o=>1/(o.d2+1e-12)),sw=w.reduce((s,v)=>s+v,0),H=d.reduce((s,o,k)=>s+w[k]*P[o.i][2],0)/sw;
  calc.innerHTML=`<div class="lbl">Spot P = (${f(x)}, ${f(y)}) in is outside every triangle (outside the tested area), so the linear method falls back to inverse distance weighting with the 3 nearest readings. Treat this value as extrapolated.</div>
  ${d.map((o,k)=>`point ${o.i+1}: d² = ${f(o.d2,4)}, w = 1/d² = ${f(w[k],4)}, H = ${P[o.i][2].toFixed(1)}`).join('<br>')}<br>
  H = Σ w·H / Σ w = ${f(d.reduce((s,o,k)=>s+w[k]*P[o.i][2],0),2)} / ${f(sw,4)}
  <div class="res">Predicted hardness at P ≈ ${H.toFixed(1)} HRB (extrapolated)</div>`;
 }
}
document.getElementById('map').addEventListener('click',e=>{const svg=e.currentTarget,pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());
 const x=(q.x-OX)/S-HX,y=HY-(q.y-OY)/S;if(Math.abs(x)<=HX&&Math.abs(y)<=HY)show(Math.round(x*1000)/1000,Math.round(y*1000)/1000)});
show(-2.715,2.237);
</script>
</body>
